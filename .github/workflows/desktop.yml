name: Desktop portable builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.mod
      - name: Install Linux WebKit build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install npm dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: node --test tests/*.test.mjs
      - name: Build desktop frontend
        run: ./node_modules/.bin/vite build --config desktop/frontend/vite.config.ts
        shell: bash
      - name: Verify embedded Go backend
        working-directory: desktop
        run: |
          go mod tidy
          go test ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build portable desktop
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p build
          cp ../public/favicon.png build/appicon.png
          WAILS="$(go env GOPATH)/bin/wails"
          if [[ "$RUNNER_OS" == "Windows" ]]; then WAILS="$WAILS.exe"; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            "$WAILS" build -clean -s -skipbindings -tags webkit2_41
          else
            "$WAILS" build -clean -s -skipbindings
          fi
      - name: Package platform downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/build/packages
          case "${{ matrix.name }}" in
            linux-x64)
              tar -czf desktop/build/packages/MicroShopStudio-Linux-x64.tar.gz -C desktop/build/bin .
              ;;
            windows-x64)
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'desktop/build/bin/*' -DestinationPath 'desktop/build/packages/MicroShopStudio-Windows-x64.zip' -Force"
              ;;
            macos-arm64)
              test -d desktop/build/bin/MicroShopStudio.app
              ditto -c -k --sequesterRsrc --keepParent desktop/build/bin/MicroShopStudio.app desktop/build/packages/MicroShopStudio-macOS-arm64.zip
              ;;
          esac

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: micro-shop-studio-${{ matrix.name }}
          path: |
            desktop/build/bin/**
            desktop/build/packages/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish or update Builds release
    needs: desktop
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-latest-release
      cancel-in-progress: false
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: micro-shop-studio-*
          path: artifacts

      - name: Check all three distributables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/micro-shop-studio-linux-x64/packages/MicroShopStudio-Linux-x64.tar.gz release-assets/
          cp artifacts/micro-shop-studio-windows-x64/packages/MicroShopStudio-Windows-x64.zip release-assets/
          cp artifacts/micro-shop-studio-macos-arm64/packages/MicroShopStudio-macOS-arm64.zip release-assets/
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          for archive in release-assets/*; do test -s "$archive"; done
          tar -tzf release-assets/MicroShopStudio-Linux-x64.tar.gz > /dev/null
          unzip -t release-assets/MicroShopStudio-Windows-x64.zip > /dev/null
          unzip -t release-assets/MicroShopStudio-macOS-arm64.zip > /dev/null

      - name: Create or update stable latest release and replace archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject old workflow runs: only the current main HEAD can replace latest.
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Skipping outdated build ${GITHUB_SHA}; current main is ${current}"
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title "Builds" --latest \
              --notes "Exécutables portables Linux, Windows et macOS. Build du commit ${GITHUB_SHA}. Les trois archives sont remplacées à chaque build réussi de main."
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Builds" --latest \
              --notes "Exécutables portables Linux, Windows et macOS. Build du commit ${GITHUB_SHA}. Les trois archives sont remplacées à chaque build réussi de main."
          fi

          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
          echo "Updated Builds / latest for commit ${GITHUB_SHA}"
