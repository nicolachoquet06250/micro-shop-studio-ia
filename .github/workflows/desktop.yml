name: Desktop portable builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.mod
      - name: Install Linux WebKit build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install npm dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: node --test tests/*.test.mjs
      - name: Build desktop frontend
        run: ./node_modules/.bin/vite build --config desktop/frontend/vite.config.ts
        shell: bash
      - name: Verify embedded Go backend
        working-directory: desktop
        run: |
          go mod tidy
          go test ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build portable desktop
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p build
          cp ../public/favicon.png build/appicon.png
          "$(go env GOPATH)/bin/wails" build -clean -s -skipbindings
      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: micro-shop-studio-${{ matrix.name }}
          path: |
            desktop/build/bin/**
          if-no-files-found: error
          retention-days: 14
